# hakyol.app yayını: repo kökü + her gün yeniden üretilen şehir sayfaları (/namaz-vakitleri/).
# Şehir sayfaları commit edilmez; vakit verisi (data/vakitler.json) haftada bir yenilenip commit'lenir.
name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 21 * * *" # 00:30 TSİ — "bugün" kutusu yeni güne geçsin
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Derleme ve yayın ayrı işler: aynı işte deploy-pages, yeni yüklenen paketi bazen
  # göremiyor ("Fetching artifact metadata failed", 11-20/22/24). GitHub'ın standart düzeni.
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.data.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vakitleri yenile (6 günden eskiyse)
        id: fetch
        continue-on-error: true
        run: node scripts/fetch-vakitler.js --max-age-days 6

      - name: Eksik ilçeleri tamamla (429 sonrası)
        continue-on-error: true
        run: node scripts/fetch-vakitler.js --only-missing

      - name: Vakit verisini commit'le
        id: data
        run: |
          if ! git diff --quiet -- data/vakitler.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git config user.name "hakyol-bot"
            git config user.email "info@hakyol.app"
            git add data/vakitler.json
            git commit -m "data: vakitler $(date -u +%F)"
            git push
          fi

      - name: Şehir sayfalarını üret
        run: node build-cities.js

      - name: Dünya şehir sayfalarını üret
        run: node build-world.js

      - name: Cuma, kıble, hicri ve widget sayfalarını üret
        run: node build-features.js

      - name: Ramazan imsakiye sayfalarını üret
        run: node build-imsakiye.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Bing/Yandex'e bildirim: push'ta ve haftalık vakit yenilemesinde (her gece değil — spam sayılmasın).
  indexnow:
    needs: [build, deploy]
    if: github.event_name != 'schedule' || needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: IndexNow
        # Üretilen site haritaları repoda yok; yayındaki sürümü indir.
        run: |
          sleep 60
          for f in sitemap-namaz.xml sitemap-world.xml; do curl -fsS "https://hakyol.app/$f" -o "$f"; done
          node scripts/indexnow.js
