# @hakyol.app toplu reels: queue.json'daki sıradaki ayet/hadis/tema paketlerini yayınlar.
# GitHub cron'u güvenilmez (11-15: 06:17 turu hiç çalışmadı, diğerleri 1-2 saat gecikti). Her tur
# 60 dk arayla 5 reels atar ve bitince bir sonrakini kendisi başlatır (zincir); gece TSİ 02-07 arası
# yayın yok, zincir 07'den sonra cron'la yeniden başlar. Cron'lar yedek. ~19 reels/gün.
# Sıra: python3 instagram/series.py (yerelde, ağ gerekir) → queue.json commit'le.
name: instagram-bulk

on:
  schedule:
    - cron: "5 4 * * *"
    - cron: "47 8 * * *"
    - cron: "17 14 * * *"
    - cron: "47 19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: instagram-bulk
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow && sudo apt-get install -y -qq ffmpeg >/dev/null

      - name: Sıradaki reels
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          git config user.name "hakyol-bot"
          git config user.email "info@hakyol.app"
          cd instagram && python bulk.py --count 5 --gap 3600

      - name: Sonraki turu başlat
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          h=$(TZ=Europe/Istanbul date +%-H)
          if [ "$h" -ge 7 ] && [ "$h" -le 23 ]; then gh workflow run instagram-bulk.yml --ref main; else echo "gece, zincir durdu ($h)"; fi
