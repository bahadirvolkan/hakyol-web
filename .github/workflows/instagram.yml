# @hakyol.app Instagram: sabah günün gönderisi + günde 4 hikâye.
# İçerik takvimi instagram/render.py'de. Görsel ana dala commit'lenmez: her çalışmada
# tek dosyalık ig-media dalına itilir (Instagram'ın çekeceği herkese açık URL için).
name: instagram

on:
  schedule:
    - cron: "30 5 * * *" # 08:30 TSİ: gönderi + hikâye 0
    - cron: "30 9 * * *" # 12:30 TSİ: hikâye 1 (şehir vakitleri)
    - cron: "30 14 * * *" # 17:30 TSİ: hikâye 2 (ayet)
    - cron: "0 18 * * *" # 21:00 TSİ: hikâye 3 (ayet)
  workflow_dispatch:
    inputs:
      date:
        description: "Tarih (YYYY-AA-GG), boşsa bugün"
        required: false
      what:
        description: "post, 0, 1, 2 ya da 3 (hikâye)"
        required: true
        default: post

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Ne paylaşılacak
        id: plan
        run: |
          case "${{ github.event.schedule }}" in
            "30 5 * * *") echo "items=post 0" ;;
            "30 9 * * *") echo "items=1" ;;
            "30 14 * * *") echo "items=2" ;;
            "0 18 * * *") echo "items=3" ;;
            *) echo "items=${{ inputs.what }}" ;;
          esac >> "$GITHUB_OUTPUT"

      - name: Üret ve yayınla
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DATE: ${{ inputs.date }}
        run: |
          git config user.name "hakyol-bot"
          git config user.email "info@hakyol.app"
          for item in ${{ steps.plan.outputs.items }}; do
            if [ "$item" = post ]; then flag=""; else flag="--story $item"; fi
            jpg=$(python instagram/render.py $DATE $flag | awk '{print $2}')
            name=$(basename "$jpg")
            blob=$(git hash-object -w "$jpg")
            tree=$(printf "100644 blob %s\t%s\n" "$blob" "$name" | git mktree)
            git push -fq origin "$(git commit-tree "$tree" -m "media $name"):refs/heads/ig-media"
            python instagram/publish.py $DATE $flag
          done
