# @hakyol.app toplu reels: queue.json'daki sıradaki ayet/hadis/tema paketlerini yayınlar.
# GitHub cron'u güvenilmez (11-15: 06:17 turu hiç çalışmadı, diğerleri 1-2 saat gecikti). Her tur
# 80 dk arayla 4 reels atar ve bitince bir sonrakini kendisi başlatır (zincir); gece TSİ 02-07 arası
# yayın yok; zincir gece kendi içinde 07:00'ye kadar bekleyip devam eder (11-22: 07:05 ve 11:47 cron'ları
# ikisi de düştü, hesap yarım gün sessiz kaldı). Cron'lar yalnız yedek. ~14 reels/gün (11-22: 19/gün takipçi getirmedi,
# sık atılanlar takıldı). Cuma 07-13 arası sıra atlanır, Cuma reels'ini instagram-cuma atar.
# Sıra: python3 instagram/series.py (yerelde, ağ gerekir) → queue.json commit'le.
name: instagram-bulk

on:
  schedule:
    - cron: "5 4 * * *"
    - cron: "47 8 * * *"
    - cron: "17 14 * * *"
    - cron: "47 19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: instagram-bulk
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow && sudo apt-get install -y -qq ffmpeg >/dev/null

      - name: Sıradaki reels
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          git config user.name "hakyol-bot"
          git config user.email "info@hakyol.app"
          cd instagram && python bulk.py --count 4 --gap 4800

      - name: Sonraki turu başlat
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          h=$(TZ=Europe/Istanbul date +%-H)
          if [ "$h" -ge 7 ] && [ "$h" -le 23 ]; then gh workflow run instagram-bulk.yml --ref main; else echo "gece ($h), sabah işi bekleyecek"; fi
          if [ "$(TZ=Europe/Istanbul date +%u)" = 5 ] && [ "$h" -ge 7 ] && [ "$h" -le 11 ]; then gh workflow run instagram-cuma.yml --ref main; fi

  # Gece biten turdan sonra 07:00 TSİ'ye kadar bekleyip zinciri sürdürür (ayrı iş: kendi 6 saatlik sınırı var).
  sabah:
    needs: run
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          h=$(TZ=Europe/Istanbul date +%-H)
          if [ "$h" -ge 7 ] && [ "$h" -le 23 ]; then echo "gündüz, zincir zaten sürüyor"; exit 0; fi
          wait=$(( $(TZ=Europe/Istanbul date -d "today 07:00" +%s) - $(date +%s) ))
          [ "$wait" -gt 0 ] || wait=0
          echo "07:00 TSİ'ye $wait sn"; sleep "$wait"
          gh workflow run instagram-bulk.yml --ref main --repo "$GITHUB_REPOSITORY"
          if [ "$(TZ=Europe/Istanbul date +%u)" = 5 ]; then gh workflow run instagram-cuma.yml --ref main --repo "$GITHUB_REPOSITORY"; fi
