# hakyol.app yayını: repo kökü + her gün yeniden üretilen şehir sayfaları (/namaz-vakitleri/).
# Şehir sayfaları commit edilmez; vakit verisi (data/vakitler.json) haftada bir yenilenip commit'lenir.
name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 21 * * *" # 00:30 TSİ — "bugün" kutusu yeni güne geçsin
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vakitleri yenile (6 günden eskiyse)
        id: fetch
        continue-on-error: true
        run: node scripts/fetch-vakitler.js --max-age-days 6

      - name: Eksik ilçeleri tamamla (429 sonrası)
        continue-on-error: true
        run: node scripts/fetch-vakitler.js --only-missing

      - name: Vakit verisini commit'le
        id: data
        run: |
          if ! git diff --quiet -- data/vakitler.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git config user.name "hakyol-bot"
            git config user.email "info@hakyol.app"
            git add data/vakitler.json
            git commit -m "data: vakitler $(date -u +%F)"
            git push
          fi

      - name: Şehir sayfalarını üret
        run: node build-cities.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4

      # Bing/Yandex'e bildirim: push'ta ve haftalık vakit yenilemesinde (her gece değil — spam sayılmasın).
      - name: IndexNow
        if: github.event_name != 'schedule' || steps.data.outputs.changed == 'true'
        continue-on-error: true
        run: node scripts/indexnow.js
